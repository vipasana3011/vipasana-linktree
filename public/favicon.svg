<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#18111A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EA"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF69B4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#pinkGlow)" stroke="#F472B6" stroke-width="2"/>
  
  <!-- Subtle inner star glint -->
  <circle cx="46" cy="18" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="18" cy="46" r="1" fill="#FFF" opacity="0.6"/>

  <!-- Elegant V Lettermark -->
  <text 
    x="32" 
    y="44" 
    font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
    font-size="34" 
    font-weight="bold" 
    font-style="italic" 
    text-anchor="middle" 
    fill="url(#goldV)" 
    filter="url(#shadow)"
  >V</text>
</svg>
